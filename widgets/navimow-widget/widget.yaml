uid: navimow_mower_card
tags: []
props:
  parameters:
  - name: activityItem
    label: Activity Item
    type: TEXT
    context: item
    description: Read-only String item linked to the mower's activity channel (navimow:mower:...:activity). Value is one of idle/mowing/paused/docked/charging/returning/error/unknown.
    required: true
  - name: controlItem
    label: Control Item
    type: TEXT
    context: item
    description: Write-only String item linked to the mower's control channel (navimow:mower:...:control). Receives START/STOP/PAUSE/RESUME/DOCK commands.
    required: true
  - name: batteryItem
    label: Battery Item
    type: TEXT
    context: item
    description: 'Plain Number item (not Number:Dimensionless) linked to the mower''s battery-level channel. Integer 0-100.'
    required: true
  - name: modelItem
    label: Model Item
    type: TEXT
    context: item
    description: Read-only String item linked to the mower's model channel (navimow:mower:...:model), e.g. "X430" or "i110". Used for the card title and to pick a per-category image (first 2 characters, e.g. "X4", "i1").
    required: true
  - name: maxWidth
    label: Max Width (optional)
    type: TEXT
    description: CSS max-width of the card. Defaults to 20rem. Set by the compact widget to fill its popup.
    required: false
  - name: title
    label: Title (optional)
    type: TEXT
    description: 'Overrides the card header text. Defaults to "Navimow " + the Model Item''s state (e.g. "Navimow X430"), or "Mower" if unavailable.'
    required: false
component: div
config:
  style:
    display: flex
    flex-direction: column
    gap: 0.75rem
    width: 100%
    max-width: '=props.maxWidth || ''20rem'''
    margin: 0 auto
    box-sizing: border-box
    padding: 0.9rem
    border-radius: 0.75rem
    background: 'var(--f7-card-bg-color, #ffffff)'
slots:
  default:
  - component: oh-context
    config:
      variables:
        defaultImage: "data:image/png;base64,"
        modelImages:
          H2: "data:image/png;base64,"
          i1: "data:image/png;base64,"
          i2: "data:image/png;base64,"
          X3: "data:image/png;base64,"
          X4: "data:image/png;base64,"
        activityMeta:
          idle: {icon: 'f7:pause_circle', color: '#9e9e9e', label: Idle}
          mowing: {icon: 'f7:play_circle_fill', color: '#43a047', label: Mowing}
          paused: {icon: 'f7:pause_circle_fill', color: '#fb8c00', label: Paused}
          docked: {icon: 'f7:house_fill', color: '#1e88e5', label: Docked}
          charging: {icon: 'f7:bolt_fill', color: '#1e88e5', label: Charging}
          returning: {icon: 'f7:arrow_uturn_left', color: '#1e88e5', label: Returning}
          error: {icon: 'f7:exclamationmark_triangle_fill', color: '#e53935', label: Error}
          unknown: {icon: 'f7:question_circle_fill', color: '#9e9e9e', label: Unknown}
        enabledMap:
          idle: [START]
          mowing: [PAUSE, STOP, DOCK]
          paused: [RESUME, STOP, DOCK]
          docked: [START]
          charging: [START]
          returning: [STOP]
          error: [STOP]
          unknown: []
        highlightMap:
          idle: null
          mowing: START
          paused: PAUSE
          docked: DOCK
          charging: DOCK
          returning: DOCK
          error: null
          unknown: null
    slots:
      default:
      # Header: title + activity chip
      - component: div
        config:
          style:
            display: flex
            justify-content: space-between
            align-items: center
            gap: 0.5rem
        slots:
          default:
          - component: div
            config:
              content: '=props.title || (items[props.modelItem] && items[props.modelItem].state ? ''Navimow '' + items[props.modelItem].state : ''Mower'')'
              style:
                font-weight: '600'
                font-size: 1rem
                overflow: hidden
                text-overflow: ellipsis
                white-space: nowrap
          - component: div
            config:
              style:
                display: flex
                align-items: center
                gap: 0.3rem
                flex-shrink: '0'
            slots:
              default:
              - component: oh-icon
                config:
                  icon: '=(vars.activityMeta[items[props.activityItem].state] || vars.activityMeta.unknown).icon'
                  style:
                    color: '=(vars.activityMeta[items[props.activityItem].state] || vars.activityMeta.unknown).color'
                    font-size: 1.1rem
              - component: div
                config:
                  content: '=(vars.activityMeta[items[props.activityItem].state] || vars.activityMeta.unknown).label'
                  style:
                    font-size: 0.85rem
                    font-weight: '600'
                    color: '=(vars.activityMeta[items[props.activityItem].state] || vars.activityMeta.unknown).color'
      # Body: model image + battery gauge
      - component: div
        config:
          style:
            display: flex
            align-items: center
            justify-content: center
            gap: 0.75rem
        slots:
          default:
          - component: img
            config:
              src: '=vars.modelImages[(items[props.modelItem] && items[props.modelItem].state || '''').slice(0,2)] || vars.defaultImage'
              style:
                flex: 1 1 auto
                min-width: 0
                width: 100%
                max-width: 12rem
                height: auto
                object-fit: contain
                display: block
          - component: div
            config:
              style:
                display: flex
                flex-direction: column
                align-items: center
                gap: 0.25rem
                flex-shrink: '0'
            slots:
              default:
              - component: div
                config:
                  content: '=(items[props.batteryItem] ? items[props.batteryItem].state : ''-'') + '' %'''
                  style:
                    font-size: 0.75rem
                    font-weight: '600'
              - component: div
                config:
                  style:
                    width: 0.9rem
                    height: 5rem
                    border-radius: 0.45rem
                    background: '#e0e0e0'
                    display: flex
                    flex-direction: column-reverse
                    overflow: hidden
                    box-sizing: border-box
                    border: '1px solid #c7c7c7'
                slots:
                  default:
                  - component: div
                    config:
                      style:
                        width: 100%
                        height: '=Math.max(0, Math.min(100, Number(items[props.batteryItem] ? items[props.batteryItem].state : 0))) + ''%'''
                        background: '=Number(items[props.batteryItem] ? items[props.batteryItem].state : 0) <= 20 ? ''#e53935'' : (Number(items[props.batteryItem] ? items[props.batteryItem].state : 0) <= 50 ? ''#fb8c00'' : ''#43a047'')'
                        transition: height 0.4s ease
      # Controls: 2-col pairs (START/STOP, PAUSE/RESUME) + full-width DOCK
      - component: div
        config:
          style:
            display: flex
            flex-direction: column
            gap: 0.5rem
        slots:
          default:
          - component: div
            config:
              style: {display: flex, gap: 0.5rem}
            slots:
              default:
              - component: oh-link
                config:
                  style:
                    flex: '1'
                    display: flex
                    align-items: center
                    justify-content: center
                    gap: 0.4rem
                    padding: 0.6rem 0.5rem
                    border-radius: 0.5rem
                    font-size: 0.8rem
                    font-weight: '600'
                    text-decoration: none
                    background: '=vars.highlightMap[items[props.activityItem].state] === ''START'' ? ''#43a047'' : ''var(--f7-block-strong-bg-color, #f2f2f2)'''
                    color: '=vars.highlightMap[items[props.activityItem].state] === ''START'' ? ''#ffffff'' : ''var(--f7-text-color)'''
                    opacity: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''START'') ? ''1'' : ''0.35'''
                    cursor: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''START'') ? ''pointer'' : ''not-allowed'''
                  action: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''START'') ? ''command'' : ''none'''
                  actionItem: '=props.controlItem'
                  actionCommand: START
                slots:
                  default:
                  - component: oh-icon
                    config: {icon: 'f7:play_fill', style: {font-size: 1rem}}
                  - component: div
                    config: {content: START}
              - component: oh-link
                config:
                  style:
                    flex: '1'
                    display: flex
                    align-items: center
                    justify-content: center
                    gap: 0.4rem
                    padding: 0.6rem 0.5rem
                    border-radius: 0.5rem
                    font-size: 0.8rem
                    font-weight: '600'
                    text-decoration: none
                    background: '=vars.highlightMap[items[props.activityItem].state] === ''STOP'' ? ''#43a047'' : ''var(--f7-block-strong-bg-color, #f2f2f2)'''
                    color: '=vars.highlightMap[items[props.activityItem].state] === ''STOP'' ? ''#ffffff'' : ''var(--f7-text-color)'''
                    opacity: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''STOP'') ? ''1'' : ''0.35'''
                    cursor: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''STOP'') ? ''pointer'' : ''not-allowed'''
                  action: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''STOP'') ? ''command'' : ''none'''
                  actionItem: '=props.controlItem'
                  actionCommand: STOP
                slots:
                  default:
                  - component: oh-icon
                    config: {icon: 'f7:stop_fill', style: {font-size: 1rem}}
                  - component: div
                    config: {content: STOP}
          - component: div
            config:
              style: {display: flex, gap: 0.5rem}
            slots:
              default:
              - component: oh-link
                config:
                  style:
                    flex: '1'
                    display: flex
                    align-items: center
                    justify-content: center
                    gap: 0.4rem
                    padding: 0.6rem 0.5rem
                    border-radius: 0.5rem
                    font-size: 0.8rem
                    font-weight: '600'
                    text-decoration: none
                    background: '=vars.highlightMap[items[props.activityItem].state] === ''PAUSE'' ? ''#43a047'' : ''var(--f7-block-strong-bg-color, #f2f2f2)'''
                    color: '=vars.highlightMap[items[props.activityItem].state] === ''PAUSE'' ? ''#ffffff'' : ''var(--f7-text-color)'''
                    opacity: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''PAUSE'') ? ''1'' : ''0.35'''
                    cursor: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''PAUSE'') ? ''pointer'' : ''not-allowed'''
                  action: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''PAUSE'') ? ''command'' : ''none'''
                  actionItem: '=props.controlItem'
                  actionCommand: PAUSE
                slots:
                  default:
                  - component: oh-icon
                    config: {icon: 'f7:pause_fill', style: {font-size: 1rem}}
                  - component: div
                    config: {content: PAUSE}
              - component: oh-link
                config:
                  style:
                    flex: '1'
                    display: flex
                    align-items: center
                    justify-content: center
                    gap: 0.4rem
                    padding: 0.6rem 0.5rem
                    border-radius: 0.5rem
                    font-size: 0.8rem
                    font-weight: '600'
                    text-decoration: none
                    background: '=vars.highlightMap[items[props.activityItem].state] === ''RESUME'' ? ''#43a047'' : ''var(--f7-block-strong-bg-color, #f2f2f2)'''
                    color: '=vars.highlightMap[items[props.activityItem].state] === ''RESUME'' ? ''#ffffff'' : ''var(--f7-text-color)'''
                    opacity: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''RESUME'') ? ''1'' : ''0.35'''
                    cursor: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''RESUME'') ? ''pointer'' : ''not-allowed'''
                  action: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''RESUME'') ? ''command'' : ''none'''
                  actionItem: '=props.controlItem'
                  actionCommand: RESUME
                slots:
                  default:
                  - component: oh-icon
                    config: {icon: 'f7:play_circle_fill', style: {font-size: 1rem}}
                  - component: div
                    config: {content: RESUME}
          - component: div
            config:
              style: {display: flex}
            slots:
              default:
              - component: oh-link
                config:
                  style:
                    flex: '1'
                    display: flex
                    align-items: center
                    justify-content: center
                    gap: 0.4rem
                    padding: 0.6rem 0.5rem
                    border-radius: 0.5rem
                    font-size: 0.8rem
                    font-weight: '600'
                    text-decoration: none
                    background: '=vars.highlightMap[items[props.activityItem].state] === ''DOCK'' ? ''#43a047'' : ''var(--f7-block-strong-bg-color, #f2f2f2)'''
                    color: '=vars.highlightMap[items[props.activityItem].state] === ''DOCK'' ? ''#ffffff'' : ''var(--f7-text-color)'''
                    opacity: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''DOCK'') ? ''1'' : ''0.35'''
                    cursor: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''DOCK'') ? ''pointer'' : ''not-allowed'''
                  action: '=(vars.enabledMap[items[props.activityItem].state] || []).includes(''DOCK'') ? ''command'' : ''none'''
                  actionItem: '=props.controlItem'
                  actionCommand: DOCK
                slots:
                  default:
                  - component: oh-icon
                    config: {icon: 'f7:house_fill', style: {font-size: 1rem}}
                  - component: div
                    config: {content: DOCK}
