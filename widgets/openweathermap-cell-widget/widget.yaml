uid: openweathermap_cell
tags: []
props:
  parameters:
  - name: prefix
    label: Item prefix
    type: TEXT
    required: false
    description: Prefix of the OWM_* items (default OWM). See the openweathermap-card-widget context.md for the item list.
  - name: unit
    label: Temperature unit
    type: TEXT
    required: false
    description: C (default) or F. Items are assumed to be in °C.
  - name: locale
    label: Language
    type: TEXT
    required: false
    description: fr (default), en or de. Passed to the card popup.
component: div
config:
  style:
    height: 120px
    margin: 10px 5px
    box-sizing: border-box
    overflow: hidden
    user-select: none
    background: 'var(--f7-card-bg-color, #ffffff)'
    border-radius: var(--f7-card-border-radius, 8px)
    box-shadow: '0px 5px 10px #00000026'
slots:
  default:
  - component: oh-context
    config:
      variables:
        p: =props.prefix || 'OWM'
        f: =(props.unit || 'C') === 'F'
    slots:
      default:
      - component: oh-link
        config:
          style:
            display: flex
            flex-direction: row
            align-items: center
            gap: 0.35rem
            width: 100%
            height: 100%
            box-sizing: border-box
            padding: 0.5rem 0.6rem
            opacity: '1'
            text-decoration: none
            color: inherit
          action: popup
          actionModal: widget:openweathermap_card
          actionModalConfig:
            prefix: =vars.p
            unit: =props.unit
            locale: =props.locale
            maxWidth: 32rem
        slots:
          default:
          - component: div
            config:
              class:
              - owm-icon
              style:
                width: clamp(2.75rem, 36%, 6rem)
                aspect-ratio: 1 / 1
                flex: 0 0 auto
                display: grid
            slots:
              default:
              - component: style
                config:
                  content: .owm-icon img.oh-image:not([src^='data:']){visibility:hidden} .owm-icon img.owm-ph{visibility:hidden} .owm-icon img.oh-image:not([src^='data:'])+img.owm-ph{visibility:visible}
              - component: oh-image
                config:
                  item: =vars.p + '_current_icon'
                  style: &id001
                    width: 100%
                    height: 100%
                    object-fit: contain
                    grid-area: 1 / 1
              - component: img
                config:
                  src: data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M20 46a10 10 0 0 1 0-20 14 14 0 0 1 27 4 8 8 0 0 1 0 16z' fill='none' stroke='%23888' stroke-width='3' stroke-linejoin='round' opacity='.5'/></svg>
                  class:
                  - owm-ph
                  style: *id001
          - component: div
            config:
              style:
                flex: 1 1 0
                min-width: '0'
                display: flex
                flex-direction: column
                justify-content: space-between
                height: 100%
            slots:
              default:
              - component: div
                config:
                  style:
                    font-size: 2rem
                    font-weight: '300'
                    line-height: '1'
                  content: '=((+items[vars.p + ''_current_temperature''].state.split('' '')[0]) !== (+items[vars.p + ''_current_temperature''].state.split('' '')[0]) ? ''–'' : Math.round(vars.f ? (+items[vars.p + ''_current_temperature''].state.split('' '')[0]) * 9 / 5 + 32 : (+items[vars.p + ''_current_temperature''].state.split('' '')[0])) + ''°'')'
              - component: div
                config:
                  style:
                    font-size: 0.75rem
                    opacity: '0.7'
                    text-transform: capitalize
                    white-space: nowrap
                    overflow: hidden
                    text-overflow: ellipsis
                  content: '=(items[vars.p + ''_current_condition''] && items[vars.p + ''_current_condition''].state !== ''NULL'' ? items[vars.p + ''_current_condition''].state : ''–'')'
              - component: div
                config:
                  style:
                    font-size: 0.75rem
                    opacity: '0.85'
                    white-space: nowrap
                    overflow: hidden
                    text-overflow: ellipsis
                  content: '=`${((+items[vars.p + ''_forecastToday_min_temperature''].state.split('' '')[0]) !== (+items[vars.p + ''_forecastToday_min_temperature''].state.split('' '')[0]) ? ''–'' : Math.round(vars.f ? (+items[vars.p + ''_forecastToday_min_temperature''].state.split('' '')[0]) * 9 / 5 + 32 : (+items[vars.p + ''_forecastToday_min_temperature''].state.split('' '')[0])) + ''°'')} / ${((+items[vars.p + ''_forecastToday_max_temperature''].state.split('' '')[0]) !== (+items[vars.p + ''_forecastToday_max_temperature''].state.split('' '')[0]) ? ''–'' : Math.round(vars.f ? (+items[vars.p + ''_forecastToday_max_temperature''].state.split('' '')[0]) * 9 / 5 + 32 : (+items[vars.p + ''_forecastToday_max_temperature''].state.split('' '')[0])) + ''°'')}`'
              - component: div
                config:
                  style:
                    display: flex
                    justify-content: space-between
                    align-items: center
                    font-size: 0.75rem
                    flex-wrap: nowrap
                    column-gap: 0.15rem
                    white-space: nowrap
                slots:
                  default:
                  - component: div
                    config:
                      style:
                        font-weight: '600'
                        color: '=(+items[vars.p + ''_forecastToday_uvindex''].state) !== (+items[vars.p + ''_forecastToday_uvindex''].state) ? ''inherit'' : (+items[vars.p + ''_forecastToday_uvindex''].state) < 3 ? ''#43a047'' : (+items[vars.p + ''_forecastToday_uvindex''].state) < 6 ? ''#fdd835'' : (+items[vars.p + ''_forecastToday_uvindex''].state) < 8 ? ''#fb8c00'' : (+items[vars.p + ''_forecastToday_uvindex''].state) < 11 ? ''#e53935'' : ''#8e24aa'''
                      content: '=''UV '' + ((+items[vars.p + ''_forecastToday_uvindex''].state) !== (+items[vars.p + ''_forecastToday_uvindex''].state) ? ''–'' : Math.round(+items[vars.p + ''_forecastToday_uvindex''].state * 10) / 10)'
                  - component: div
                    config:
                      style:
                        display: flex
                        align-items: center
                        gap: 0.1rem
                        color: '#4a90e2'
                    slots:
                      default:
                      - component: oh-icon
                        config:
                          icon: f7:drop_fill
                          size: '11'
                      - component: div
                        config:
                          style: {}
                          content: '=((+items[vars.p + ''_forecastToday_precip_probability''].state.split('' '')[0]) !== (+items[vars.p + ''_forecastToday_precip_probability''].state.split('' '')[0]) ? ''–'' : Math.round((+items[vars.p + ''_forecastToday_precip_probability''].state.split('' '')[0]) * (items[vars.p + ''_forecastToday_precip_probability''].state.indexOf(''%'') >= 0 ? 1 : 100)) + ''%'')'
