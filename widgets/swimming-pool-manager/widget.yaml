uid: swimming_pool_manager
tags: []
props:
  parameterGroups:
    - name: special
      label: Special commands items
    - name: filtration
      label: Filtration items
    - name: heating
      label: Heating items
  parameters:
    - name: itemFiltrationForcedMode
      label: Forced Filtration Switch Item
      type: TEXT
      context: item
      description: Switch item toggling forced vs normal filtration mode
      required: true
      defaultValue: swimmingPoolFiltrationForcedOperation
      groupName: special
    - name: itemOffSeasonMode
      label: Off-season (Winter) Mode Switch Item
      type: TEXT
      context: item
      description: Switch item enabling/disabling winterization mode
      required: true
      defaultValue: swimmingPoolOffSeasonMode
      groupName: special
    - name: itemFiltrationPump
      label: Filtration Pump Switch Item
      type: TEXT
      context: item
      description: Switch item starting/stopping the filtration pump
      required: true
      defaultValue: Pool_Controller_Swimming_Pool_Pump
      groupName: filtration
    - name: itemHeaterPower
      label: Heat Pump Power Switch Item
      type: TEXT
      context: item
      description: Switch item turning the heat pump on/off
      required: true
      defaultValue: swimmingpoolHeaterPower
      groupName: heating
    - name: itemHeaterMode
      label: Heat Pump Mode Item
      type: TEXT
      context: item
      description: Item holding the heat pump operating mode (Auto, Heat, SilentHeat, BoostHeat, Cool, SilentCool, BoostCool)
      required: true
      defaultValue: Poolex_Jetblack_FI_7_mode
      groupName: heating
    - name: itemWaterTemperatureSetpoint
      label: Water Temperature Setpoint Item
      type: TEXT
      context: item
      description: Number item holding the heat pump target water temperature
      required: true
      defaultValue: swimmingPoolWaterTemperatureSetpoint
      groupName: heating
    - name: itemInputWaterTemperature
      label: Inlet Water Temperature Item
      type: TEXT
      context: item
      description: Read-only number item for the water temperature entering the heat pump
      required: true
      defaultValue: Pool_Controller_Temperature_Eau_Injection_Piscine
      groupName: heating
    - name: itemPoolWaterTemperature
      label: Pool Water Temperature Item
      type: TEXT
      context: item
      description: Read-only number item for the water temperature injected back into the pool
      required: true
      defaultValue: Pool_Controller_Temperature_Eau_Piscine
      groupName: heating
component: div
config:
  style:
    display: flex
    flex-direction: column
    gap: 1rem
    width: 100%
    max-width: 100%
    flex: 1 1 100%
    grid-column: 1 / -1
    box-sizing: border-box
slots:
  default:
    - component: div
      config:
        style:
          display: flex
          align-items: center
          gap: 0.5rem
          padding: "0 0.25rem"
      slots:
        default:
          - component: img
            config:
              src: "data:image/png;base64,"
              style:
                width: 2rem
                height: 2rem
                flex-shrink: "0"
          - component: div
            config:
              content: Centre commande piscine
              style:
                font-size: 1.25rem
                font-weight: "600"
    - component: oh-list-card
      config:
        title: Commandes spéciales
        style:
          width: 100%
          margin: 0
      slots:
        default:
          - component: oh-toggle-item
            config:
              item: =props.itemFiltrationForcedMode
              title: Filtration forcée
              icon: f7:bolt_fill
          - component: oh-toggle-item
            config:
              item: =props.itemOffSeasonMode
              title: Mode Hivernage
              icon: f7:snow
    - component: oh-list-card
      config:
        style:
          width: 100%
          margin: 0
      slots:
        header:
          - component: f7-card-header
            slots:
              default:
                - component: div
                  config:
                    style:
                      display: flex
                      align-items: center
                      gap: 0.5rem
                  slots:
                    default:
                      - component: img
                        config:
                          src: "data:image/png;base64,"
                          style:
                            width: 1.75rem
                            height: 1.75rem
                            flex-shrink: "0"
                      - component: div
                        config:
                          content: Filtration
        default:
          - component: oh-toggle-item
            config:
              item: =props.itemFiltrationPump
              title: Pompe de filtration
              icon: f7:drop_fill
              visible: "=items[props.itemFiltrationForcedMode].state != 'ON'"
          - component: oh-label-item
            config:
              item: =props.itemFiltrationPump
              title: Pompe de filtration
              subtitle: Verrouillée (filtration forcée active)
              icon: f7:drop_fill
              after: "=items[props.itemFiltrationPump].displayState || items[props.itemFiltrationPump].state"
              visible: "=items[props.itemFiltrationForcedMode].state == 'ON'"
    - component: oh-list-card
      config:
        style:
          width: 100%
          margin: 0
      slots:
        header:
          - component: f7-card-header
            slots:
              default:
                - component: div
                  config:
                    style:
                      display: flex
                      align-items: center
                      gap: 0.5rem
                  slots:
                    default:
                      - component: img
                        config:
                          src: "data:image/png;base64,"
                          style:
                            width: 1.75rem
                            height: 1.75rem
                            flex-shrink: "0"
                      - component: div
                        config:
                          content: Chauffage
        default:
          - component: oh-toggle-item
            config:
              item: =props.itemHeaterPower
              title: Pompe à chaleur
              icon: f7:flame_fill
          - component: oh-list-item
            config:
              title: Mode de la pompe à chaleur
              icon: f7:thermometer
              after: "=({'Auto':'Auto','Heat':'Chauffe Eco','SilentHeat':'Chauffe Silencieuse','BoostHeat':'Chauffe Boost','Cool':'Refroidissement Eco','SilentCool':'Refroidissement Silencieux','BoostCool':'Refroidissement Boost'})[items[props.itemHeaterMode].state] || items[props.itemHeaterMode].state"
              action: options
              actionItem: =props.itemHeaterMode
              actionOptions: "Auto=Auto,Heat=Chauffe Eco,SilentHeat=Chauffe Silencieuse,BoostHeat=Chauffe Boost,Cool=Refroidissement Eco,SilentCool=Refroidissement Silencieux,BoostCool=Refroidissement Boost"
          - component: oh-stepper-item
            config:
              item: =props.itemWaterTemperatureSetpoint
              title: Consigne température eau
              icon: f7:thermometer
              min: 15
              max: 32
              step: 0.5
              autorepeat: true
              autorepeatDynamic: true
          - component: oh-label-item
            config:
              item: =props.itemInputWaterTemperature
              title: Température eau provenance piscine
              icon: f7:thermometer
              after: "=items[props.itemInputWaterTemperature].displayState || items[props.itemInputWaterTemperature].state"
              action: analyzer
              actionAnalyzerItems: =props.itemInputWaterTemperature
          - component: oh-label-item
            config:
              item: =props.itemPoolWaterTemperature
              title: Température eau injectée piscine
              icon: f7:thermometer
              after: "=items[props.itemPoolWaterTemperature].displayState || items[props.itemPoolWaterTemperature].state"
              action: analyzer
              actionAnalyzerItems: =props.itemPoolWaterTemperature
