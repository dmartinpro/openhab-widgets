uid: openweathermap_card
tags: []
props:
  parameters:
  - name: prefix
    label: Item prefix
    type: TEXT
    required: false
    description: Prefix of the OWM_* items (default OWM). Items are named <prefix>_<group>_<channel>, e.g. OWM_forecastDay2_max_temperature.
  - name: days
    label: Days shown
    type: INTEGER
    required: false
    description: Number of days including today (default 5, max 5 with the items created so far).
  - name: unit
    label: Temperature unit
    type: TEXT
    required: false
    description: C (default) or F. Items are assumed to be in °C.
  - name: locale
    label: Language
    type: TEXT
    required: false
    description: fr (default), en or de.
  - name: title
    label: Title
    type: TEXT
    required: false
    description: Overrides the header text.
  - name: maxWidth
    label: Max width
    type: TEXT
    required: false
    description: CSS max-width of the card, default 28rem.
component: oh-context
config:
  variables:
    p: =props.prefix || 'OWM'
    f: =(props.unit || 'C') === 'F'
    loc: =props.locale || 'fr'
    names:
      fr: dim,lun,mar,mer,jeu,ven,sam
      en: Sun,Mon,Tue,Wed,Thu,Fri,Sat
      de: So,Mo,Di,Mi,Do,Fr,Sa
    L:
      fr:
        title: Météo du jour
        wind: Vent
        rain: Pluie
        humidity: Humidité
        sunrise: Lever
        sunset: Coucher
      en:
        title: Weather today
        wind: Wind
        rain: Rain
        humidity: Humidity
        sunrise: Sunrise
        sunset: Sunset
      de:
        title: Wetter heute
        wind: Wind
        rain: Regen
        humidity: Feuchte
        sunrise: Aufgang
        sunset: Untergang
slots:
  default:
  - component: div
    config:
      style:
        display: flex
        flex-direction: column
        gap: 0.75rem
        box-sizing: border-box
        padding: 1rem
        margin: 10px auto
        max-width: =props.maxWidth || '28rem'
        background: 'var(--f7-card-bg-color, #ffffff)'
        border-radius: var(--f7-card-border-radius, 8px)
        box-shadow: '0px 5px 10px #00000026'
        user-select: none
    slots:
      default:
      - component: div
        config:
          style:
            font-size: 0.8rem
            font-weight: '600'
            letter-spacing: 0.05em
            text-transform: uppercase
            opacity: '0.6'
          content: =props.title || vars.L[vars.loc].title
      - component: div
        config:
          style:
            display: flex
            align-items: center
            gap: 1rem
        slots:
          default:
          - component: div
            config:
              style:
                width: 5rem
                height: 5rem
                flex: 0 0 auto
                display: grid
            slots:
              default:
              - component: oh-image
                config:
                  item: =vars.p + '_current_icon'
                  style:
                    width: 100%
                    height: 100%
                    object-fit: contain
                    grid-area: 1 / 1
                    visibility: '=((items[vars.p + ''_current_icon''] && items[vars.p + ''_current_icon''].state && items[vars.p + ''_current_icon''].state !== ''NULL'' && items[vars.p + ''_current_icon''].state !== ''UNDEF'' && items[vars.p + ''_current_icon''].state !== ''-'') ? true : false) ? ''visible'' : ''hidden'''
              - component: img
                config:
                  src: data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M20 46a10 10 0 0 1 0-20 14 14 0 0 1 27 4 8 8 0 0 1 0 16z' fill='none' stroke='%23888' stroke-width='3' stroke-linejoin='round' opacity='.5'/></svg>
                  visible: '=((items[vars.p + ''_current_icon''] && items[vars.p + ''_current_icon''].state && items[vars.p + ''_current_icon''].state !== ''NULL'' && items[vars.p + ''_current_icon''].state !== ''UNDEF'' && items[vars.p + ''_current_icon''].state !== ''-'') ? true : false) ? false : true'
                  style:
                    width: 100%
                    height: 100%
                    object-fit: contain
                    grid-area: 1 / 1
          - component: div
            config:
              style:
                flex: 1 1 0
                min-width: '0'
                display: flex
                flex-direction: column
                gap: 0.25rem
            slots:
              default:
              - component: div
                config:
                  style:
                    font-size: 2.5rem
                    font-weight: '300'
                    line-height: '1'
                  content: '=((+items[vars.p + ''_current_temperature''].state.split('' '')[0]) !== (+items[vars.p + ''_current_temperature''].state.split('' '')[0]) ? ''–'' : Math.round(vars.f ? (+items[vars.p + ''_current_temperature''].state.split('' '')[0]) * 9 / 5 + 32 : (+items[vars.p + ''_current_temperature''].state.split('' '')[0])) + ''°'')'
              - component: div
                config:
                  style:
                    font-size: 0.85rem
                    opacity: '0.8'
                  content: '=`${(items[vars.p + ''_current_condition''] && items[vars.p + ''_current_condition''].state !== ''NULL'' ? items[vars.p + ''_current_condition''].state : ''–'')} · ${((+items[vars.p + ''_forecastToday_min_temperature''].state.split('' '')[0]) !== (+items[vars.p + ''_forecastToday_min_temperature''].state.split('' '')[0]) ? ''–'' : Math.round(vars.f ? (+items[vars.p + ''_forecastToday_min_temperature''].state.split('' '')[0]) * 9 / 5 + 32 : (+items[vars.p + ''_forecastToday_min_temperature''].state.split('' '')[0])) + ''°'')}/${((+items[vars.p + ''_forecastToday_max_temperature''].state.split('' '')[0]) !== (+items[vars.p + ''_forecastToday_max_temperature''].state.split('' '')[0]) ? ''–'' : Math.round(vars.f ? (+items[vars.p + ''_forecastToday_max_temperature''].state.split('' '')[0]) * 9 / 5 + 32 : (+items[vars.p + ''_forecastToday_max_temperature''].state.split('' '')[0])) + ''°'')} · ${vars.L[vars.loc].wind} ${(items[vars.p + ''_current_wind_speed''] && items[vars.p + ''_current_wind_speed''].state !== ''NULL'' ? items[vars.p + ''_current_wind_speed''].displayState : ''–'')} · ${vars.L[vars.loc].rain} ${((+items[vars.p + ''_forecastToday_rain''].state.split('' '')[0]) !== (+items[vars.p + ''_forecastToday_rain''].state.split('' '')[0]) ? ''–'' : (Math.round((+items[vars.p + ''_forecastToday_rain''].state.split('' '')[0]) * (items[vars.p + ''_forecastToday_rain''].state.slice(-3) === '' mm'' ? 1 : 1000) * 10) / 10) + '' mm'')} · ${((+items[vars.p + ''_forecastToday_precip_probability''].state.split('' '')[0]) !== (+items[vars.p + ''_forecastToday_precip_probability''].state.split('' '')[0]) ? ''–'' : Math.round((+items[vars.p + ''_forecastToday_precip_probability''].state.split('' '')[0]) * (items[vars.p + ''_forecastToday_precip_probability''].state.indexOf(''%'') >= 0 ? 1 : 100)) + '' %'')}`'
      - component: div
        config:
          style:
            display: flex
            flex-wrap: wrap
            justify-content: space-between
            gap: 0.25rem 0.75rem
            font-size: 0.8rem
            opacity: '0.85'
        slots:
          default:
          - component: div
            config:
              style: {}
              content: '=''UV '' + ((+items[vars.p + ''_forecastToday_uvindex''].state) !== (+items[vars.p + ''_forecastToday_uvindex''].state) ? ''–'' : Math.round(+items[vars.p + ''_forecastToday_uvindex''].state * 10) / 10)'
          - component: div
            config:
              style: {}
              content: '=vars.L[vars.loc].humidity + '' '' + ((+items[vars.p + ''_forecastToday_humidity''].state.split('' '')[0]) !== (+items[vars.p + ''_forecastToday_humidity''].state.split('' '')[0]) ? ''–'' : Math.round((+items[vars.p + ''_forecastToday_humidity''].state.split('' '')[0]) * (items[vars.p + ''_forecastToday_humidity''].state.indexOf(''%'') >= 0 ? 1 : 100)) + '' %'')'
          - component: div
            config:
              style: {}
              content: '=vars.L[vars.loc].sunrise + '' '' + (items[vars.p + ''_forecastToday_sunrise''] && items[vars.p + ''_forecastToday_sunrise''].state.length > 15 ? items[vars.p + ''_forecastToday_sunrise''].state.slice(11, 16) : ''–'')'
          - component: div
            config:
              style: {}
              content: '=vars.L[vars.loc].sunset + '' '' + (items[vars.p + ''_forecastToday_sunset''] && items[vars.p + ''_forecastToday_sunset''].state.length > 15 ? items[vars.p + ''_forecastToday_sunset''].state.slice(11, 16) : ''–'')'
      - component: div
        config:
          style:
            display: flex
            gap: 0.25rem
            border-top: 1px solid var(--f7-list-item-border-color, rgba(128,128,128,0.3))
            padding-top: 0.75rem
        slots:
          default:
          - component: oh-repeater
            config:
              fragment: true
              sourceType: array
              for: g
              in: =['forecastTomorrow','forecastDay2','forecastDay3','forecastDay4'].slice(0, Math.min(props.days || 5, 5) - 1)
            slots:
              default:
              - component: oh-context
                config:
                  variables:
                    d: =vars.p + '_' + loop.g + '_'
                slots:
                  default:
                  - component: div
                    config:
                      style:
                        flex: 1 1 0
                        min-width: '0'
                        display: flex
                        flex-direction: column
                        align-items: center
                        gap: 0.25rem
                        text-align: center
                    slots:
                      default:
                      - component: div
                        config:
                          style:
                            font-weight: '600'
                          content: '=vars.names[vars.loc].split('','')[(((+items[vars.p + ''_'' + loop.g + ''_time_stamp''].state.slice(0, 10).slice(0,4)) - ((+items[vars.p + ''_'' + loop.g + ''_time_stamp''].state.slice(0, 10).slice(5,7)) < 3 ? 1 : 0)) + Math.floor(((+items[vars.p + ''_'' + loop.g + ''_time_stamp''].state.slice(0, 10).slice(0,4)) - ((+items[vars.p + ''_'' + loop.g + ''_time_stamp''].state.slice(0, 10).slice(5,7)) < 3 ? 1 : 0)) / 4) - Math.floor(((+items[vars.p + ''_'' + loop.g + ''_time_stamp''].state.slice(0, 10).slice(0,4)) - ((+items[vars.p + ''_'' + loop.g + ''_time_stamp''].state.slice(0, 10).slice(5,7)) < 3 ? 1 : 0)) / 100) + Math.floor(((+items[vars.p + ''_'' + loop.g + ''_time_stamp''].state.slice(0, 10).slice(0,4)) - ((+items[vars.p + ''_'' + loop.g + ''_time_stamp''].state.slice(0, 10).slice(5,7)) < 3 ? 1 : 0)) / 400) + (+''032503514624''.charAt((+items[vars.p + ''_'' + loop.g + ''_time_stamp''].state.slice(0, 10).slice(5,7)) - 1)) + (+items[vars.p + ''_'' + loop.g + ''_time_stamp''].state.slice(0, 10).slice(8,10))) % 7]'
                      - component: div
                        config:
                          style:
                            font-size: 0.7rem
                            opacity: '0.6'
                          content: =items[vars.p + '_' + loop.g + '_time_stamp'].state.slice(0, 10).slice(8, 10) + '/' + items[vars.p + '_' + loop.g + '_time_stamp'].state.slice(0, 10).slice(5, 7)
                      - component: div
                        config:
                          style:
                            width: 2.2rem
                            height: 2.2rem
                            flex: 0 0 auto
                            display: grid
                        slots:
                          default:
                          - component: oh-image
                            config:
                              item: =vars.d + 'icon'
                              style:
                                width: 100%
                                height: 100%
                                object-fit: contain
                                grid-area: 1 / 1
                                visibility: '=((items[vars.d + ''icon''] && items[vars.d + ''icon''].state && items[vars.d + ''icon''].state !== ''NULL'' && items[vars.d + ''icon''].state !== ''UNDEF'' && items[vars.d + ''icon''].state !== ''-'') ? true : false) ? ''visible'' : ''hidden'''
                          - component: img
                            config:
                              src: data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M20 46a10 10 0 0 1 0-20 14 14 0 0 1 27 4 8 8 0 0 1 0 16z' fill='none' stroke='%23888' stroke-width='3' stroke-linejoin='round' opacity='.5'/></svg>
                              visible: '=((items[vars.d + ''icon''] && items[vars.d + ''icon''].state && items[vars.d + ''icon''].state !== ''NULL'' && items[vars.d + ''icon''].state !== ''UNDEF'' && items[vars.d + ''icon''].state !== ''-'') ? true : false) ? false : true'
                              style:
                                width: 100%
                                height: 100%
                                object-fit: contain
                                grid-area: 1 / 1
                      - component: div
                        config:
                          style:
                            font-weight: '700'
                          content: '=`${((+items[vars.d + ''max_temperature''].state.split('' '')[0]) !== (+items[vars.d + ''max_temperature''].state.split('' '')[0]) ? ''–'' : Math.round(vars.f ? (+items[vars.d + ''max_temperature''].state.split('' '')[0]) * 9 / 5 + 32 : (+items[vars.d + ''max_temperature''].state.split('' '')[0])) + ''°'')} / ${((+items[vars.d + ''min_temperature''].state.split('' '')[0]) !== (+items[vars.d + ''min_temperature''].state.split('' '')[0]) ? ''–'' : Math.round(vars.f ? (+items[vars.d + ''min_temperature''].state.split('' '')[0]) * 9 / 5 + 32 : (+items[vars.d + ''min_temperature''].state.split('' '')[0])) + ''°'')}`'
                      - component: div
                        config:
                          style:
                            font-size: 0.8rem
                            color: '#4a90e2'
                          content: '=((+items[vars.d + ''precip_probability''].state.split('' '')[0]) !== (+items[vars.d + ''precip_probability''].state.split('' '')[0]) ? ''–'' : Math.round((+items[vars.d + ''precip_probability''].state.split('' '')[0]) * (items[vars.d + ''precip_probability''].state.indexOf(''%'') >= 0 ? 1 : 100)) + '' %'')'
                      - component: div
                        config:
                          style:
                            font-size: 0.8rem
                            color: '#4a90e2'
                          content: '=((+items[vars.d + ''rain''].state.split('' '')[0]) !== (+items[vars.d + ''rain''].state.split('' '')[0]) ? ''–'' : (Math.round((+items[vars.d + ''rain''].state.split('' '')[0]) * (items[vars.d + ''rain''].state.slice(-3) === '' mm'' ? 1 : 1000) * 10) / 10) + '' mm'')'
                      - component: div
                        config:
                          style:
                            font-size: 0.75rem
                            font-weight: '600'
                            color: '=(+items[vars.d + ''uvindex''].state) < 3 ? ''#43a047'' : (+items[vars.d + ''uvindex''].state) < 6 ? ''#fdd835'' : (+items[vars.d + ''uvindex''].state) < 8 ? ''#fb8c00'' : (+items[vars.d + ''uvindex''].state) < 11 ? ''#e53935'' : ''#8e24aa'''
                          content: ='UV ' + Math.round((+items[vars.d + 'uvindex'].state) * 10) / 10
                          visible: '=(items[vars.d + ''uvindex''] && items[vars.d + ''uvindex''].state && items[vars.d + ''uvindex''].state !== ''NULL'' && items[vars.d + ''uvindex''].state !== ''UNDEF'' && items[vars.d + ''uvindex''].state !== ''-'') ? true : false'
