uid: diagral_alarm_controller
tags: []
props:
  parameterGroups:
  - name: control
    label: Batch Control (required)
  - name: zone1
    label: Zone 1
  - name: zone2
    label: Zone 2 (optional)
  - name: zone3
    label: Zone 3 (optional)
  - name: zone4
    label: Zone 4 (optional)
  - name: colors
    label: Colors
  - name: status
    label: Status (optional)
  parameters:
  - name: activateGroupsItem
    label: Activate Groups Item
    type: TEXT
    context: item
    description: String item linked to the alarm-system Thing's activate-groups channel (diagral:group-batch-activate). Receives a comma-separated list of numeric group IDs in one command.
    required: true
    groupName: control
  - name: disableGroupsItem
    label: Disable Groups Item
    type: TEXT
    context: item
    description: String item linked to the alarm-system Thing's disable-groups channel (diagral:group-batch-disable). Receives a comma-separated list of numeric group IDs in one command.
    required: true
    groupName: control
  - name: zone1Item
    label: Zone 1 Item
    type: TEXT
    context: item
    description: 'Switch item linked to this zone''s active channel (read-only for this widget: shows selection/armed state).'
    required: true
    groupName: zone1
  - name: zone1GroupId
    label: Zone 1 Group ID
    type: INTEGER
    description: Numeric Diagral group ID for this zone (the group Thing's own ID, not necessarily the zone slot number). Sent to activate-groups/disable-groups.
    required: true
    groupName: zone1
  - name: zone1Label
    label: Zone 1 Label
    type: TEXT
    required: false
    defaultValue: Zone 1
    groupName: zone1
  - name: zone1Icon
    label: Zone 1 Icon
    type: TEXT
    context: icon
    required: false
    defaultValue: f7:house_fill
    groupName: zone1
  - name: zone2Item
    label: Zone 2 Item
    type: TEXT
    context: item
    description: Switch item linked to this zone's active channel (read-only for this widget). Leave empty to use only 2 or 3 zones.
    required: false
    groupName: zone2
  - name: zone2GroupId
    label: Zone 2 Group ID
    type: INTEGER
    description: Numeric Diagral group ID for this zone. Required if Zone 2 Item is set.
    required: false
    groupName: zone2
  - name: zone2Label
    label: Zone 2 Label
    type: TEXT
    required: false
    defaultValue: Zone 2
    groupName: zone2
  - name: zone2Icon
    label: Zone 2 Icon
    type: TEXT
    context: icon
    required: false
    defaultValue: f7:bed_double_fill
    groupName: zone2
  - name: zone3Item
    label: Zone 3 Item
    type: TEXT
    context: item
    description: Switch item linked to this zone's active channel (read-only for this widget). Leave empty to skip.
    required: false
    groupName: zone3
  - name: zone3GroupId
    label: Zone 3 Group ID
    type: INTEGER
    description: Numeric Diagral group ID for this zone. Required if Zone 3 Item is set.
    required: false
    groupName: zone3
  - name: zone3Label
    label: Zone 3 Label
    type: TEXT
    required: false
    defaultValue: Zone 3
    groupName: zone3
  - name: zone3Icon
    label: Zone 3 Icon
    type: TEXT
    context: icon
    required: false
    defaultValue: f7:building_2_fill
    groupName: zone3
  - name: zone4Item
    label: Zone 4 Item
    type: TEXT
    context: item
    description: Switch item linked to this zone's active channel (read-only for this widget). Leave empty to skip.
    required: false
    groupName: zone4
  - name: zone4GroupId
    label: Zone 4 Group ID
    type: INTEGER
    description: Numeric Diagral group ID for this zone. Required if Zone 4 Item is set.
    required: false
    groupName: zone4
  - name: zone4Label
    label: Zone 4 Label
    type: TEXT
    required: false
    defaultValue: Zone 4
    groupName: zone4
  - name: zone4Icon
    label: Zone 4 Icon
    type: TEXT
    context: icon
    required: false
    defaultValue: f7:car_fill
    groupName: zone4
  - name: activeColor
    label: Active Zone Color
    type: COLOR
    description: Background fill for a zone button whose activeItem is ON.
    required: false
    defaultValue: '#e53935'
    groupName: colors
  - name: selectedBorderColor
    label: Selected Zone Border Color
    type: COLOR
    description: Border shown on a zone button while it's selected.
    required: false
    defaultValue: '#424242'
    groupName: colors
  - name: activateColor
    label: Central Button "Activate" Tint
    type: COLOR
    description: Icon tint when the central button proposes activating.
    required: false
    defaultValue: '#43a047'
    groupName: colors
  - name: deactivateColor
    label: Central Button "Deactivate" Tint
    type: COLOR
    description: Icon tint when the central button proposes deactivating.
    required: false
    defaultValue: '#e53935'
    groupName: colors
  - name: pendingColor
    label: Central Button "Pending" Tint
    type: COLOR
    description: Icon tint while a just-sent command has not yet been confirmed by real item state (re-clicking during this window is suppressed to avoid sending the same command twice).
    required: false
    defaultValue: '#fb8c00'
    groupName: colors
  - name: armedStatusItem
    label: Armed Status Item (optional)
    type: TEXT
    context: item
    description: Read-only String item (armed-status channel) to show as a cosmetic label under the ring. Not used for any control logic.
    required: false
    groupName: status
