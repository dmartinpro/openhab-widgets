uid: tempo_widget
tags: []
props:
  parameters:
  - name: todayItem
    label: Today Item
    type: TEXT
    context: item
    description: String item holding today's Tempo color (BLUE, WHITE or RED). Any other value is shown as N/A.
    required: true
  - name: tomorrowItem
    label: Tomorrow Item
    type: TEXT
    context: item
    description: String item holding tomorrow's Tempo color (BLUE, WHITE or RED). Any other value is shown as N/A.
    required: true
  - name: timestampItem
    label: Last Update Item
    type: TEXT
    context: item
    description: DateTime item holding the last successful update time. Shown as YYYY-MM-DD HH:mm.
    required: true
  - name: todayLabel
    label: Today Label
    type: TEXT
    description: Label under the left circle. Defaults to "Today" when empty.
    required: false
  - name: tomorrowLabel
    label: Tomorrow Label
    type: TEXT
    description: Label under the right circle. Defaults to "Tomorrow" when empty.
    required: false
component: div
config:
  style:
    display: flex
    flex-direction: column
    align-items: center
    justify-content: center
    gap: 0.4rem
    height: 120px
    margin: 10px 5px
    box-sizing: border-box
    padding: 0.5rem
    position: relative
    overflow: hidden
    user-select: none
    font-size: 16px
    background: 'var(--f7-card-bg-color, #ffffff)'
    border-radius: var(--f7-card-border-radius, 8px)
    box-shadow: '0px 5px 10px #00000026'
slots:
  default:
  - component: oh-context
    config:
      variables:
        tempo:
          BLUE:
            bg: 'radial-gradient(ellipse at 50% 18%, rgba(255,255,255,0.75) 0, rgba(255,255,255,0) 42%), radial-gradient(circle at 35% 30%, #90caf9 0, #1e88e5 55%, #0d47a1 100%)'
            shadow: 'inset -0.25rem -0.35rem 0.6rem rgba(0,0,0,0.3), inset 0.15rem 0.15rem 0.4rem rgba(255,255,255,0.35), 0 0.15rem 0.35rem rgba(0,0,0,0.3), 0 0 0.8rem rgba(30,136,229,0.65)'
            text: ''
          WHITE:
            bg: 'radial-gradient(ellipse at 50% 18%, rgba(255,255,255,0.75) 0, rgba(255,255,255,0) 42%), radial-gradient(circle at 35% 30%, #ffffff 0, #f0f0f0 55%, #9e9e9e 100%)'
            shadow: 'inset -0.25rem -0.35rem 0.6rem rgba(0,0,0,0.3), inset 0.15rem 0.15rem 0.4rem rgba(255,255,255,0.35), 0 0.15rem 0.35rem rgba(0,0,0,0.3), 0 0 0.8rem rgba(255,255,255,0.7)'
            text: ''
          RED:
            bg: 'radial-gradient(ellipse at 50% 18%, rgba(255,255,255,0.75) 0, rgba(255,255,255,0) 42%), radial-gradient(circle at 35% 30%, #ff8a80 0, #e53935 55%, #8e0000 100%)'
            shadow: 'inset -0.25rem -0.35rem 0.6rem rgba(0,0,0,0.3), inset 0.15rem 0.15rem 0.4rem rgba(255,255,255,0.35), 0 0.15rem 0.35rem rgba(0,0,0,0.3), 0 0 0.8rem rgba(229,57,53,0.65)'
            text: ''
          NA:
            bg: 'radial-gradient(ellipse at 50% 18%, rgba(255,255,255,0.75) 0, rgba(255,255,255,0) 42%), radial-gradient(circle at 35% 30%, #e0e0e0 0, #9e9e9e 55%, #616161 100%)'
            shadow: 'inset -0.25rem -0.35rem 0.6rem rgba(0,0,0,0.3), inset 0.15rem 0.15rem 0.4rem rgba(255,255,255,0.35), 0 0.15rem 0.35rem rgba(0,0,0,0.3)'
            text: N/A
    slots:
      default:
      - component: div
        config:
          style:
            display: flex
            justify-content: space-around
            gap: 0.5rem
            width: 100%
        slots:
          default:
          - component: div
            config:
              style:
                flex: 1 1 0
                min-width: 0
                display: flex
                flex-direction: column
                align-items: center
                gap: 0.25rem
            slots:
              default:
              - component: div
                config:
                  content: '=(vars.tempo[items[props.todayItem] && items[props.todayItem].state] || vars.tempo.NA).text'
                  style:
                    flex: none
                    box-sizing: border-box
                    width: 3.2rem
                    height: 3.2rem
                    border-radius: 50%
                    border: 0.2rem solid rgba(110,110,110,0.55)
                    background-clip: padding-box
                    display: flex
                    align-items: center
                    justify-content: center
                    font-weight: '600'
                    color: '#ffffff'
                    text-shadow: 0 1px 2px rgba(0,0,0,0.5)
                    background: '=(vars.tempo[items[props.todayItem] && items[props.todayItem].state] || vars.tempo.NA).bg'
                    box-shadow: '=(vars.tempo[items[props.todayItem] && items[props.todayItem].state] || vars.tempo.NA).shadow'
              - component: div
                config:
                  content: '=props.todayLabel || ''Today'''
                  style:
                    font-weight: '600'
                    font-size: 0.8rem
          - component: div
            config:
              style:
                flex: 1 1 0
                min-width: 0
                display: flex
                flex-direction: column
                align-items: center
                gap: 0.25rem
            slots:
              default:
              - component: div
                config:
                  content: '=(vars.tempo[items[props.tomorrowItem] && items[props.tomorrowItem].state] || vars.tempo.NA).text'
                  style:
                    flex: none
                    box-sizing: border-box
                    width: 3.2rem
                    height: 3.2rem
                    border-radius: 50%
                    border: 0.2rem solid rgba(110,110,110,0.55)
                    background-clip: padding-box
                    display: flex
                    align-items: center
                    justify-content: center
                    font-weight: '600'
                    color: '#ffffff'
                    text-shadow: 0 1px 2px rgba(0,0,0,0.5)
                    background: '=(vars.tempo[items[props.tomorrowItem] && items[props.tomorrowItem].state] || vars.tempo.NA).bg'
                    box-shadow: '=(vars.tempo[items[props.tomorrowItem] && items[props.tomorrowItem].state] || vars.tempo.NA).shadow'
              - component: div
                config:
                  content: '=props.tomorrowLabel || ''Tomorrow'''
                  style:
                    font-weight: '600'
                    font-size: 0.8rem
      - component: div
        config:
          content: '=(items[props.timestampItem] && items[props.timestampItem].state || '''').slice(10,11) === ''T'' ? items[props.timestampItem].state.slice(0,10) + '' '' + items[props.timestampItem].state.slice(11,16) : ''—'''
          style:
            font-size: 0.75rem
            opacity: '0.7'
