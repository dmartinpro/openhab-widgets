uid: tempo_widget
tags: []
props:
  parameters:
  - name: todayItem
    label: Today Item
    type: TEXT
    context: item
    description: String item holding today's Tempo color (BLUE, WHITE or RED). Any other value is shown as N/A.
    required: true
  - name: tomorrowItem
    label: Tomorrow Item
    type: TEXT
    context: item
    description: String item holding tomorrow's Tempo color (BLUE, WHITE or RED). Any other value is shown as N/A.
    required: true
  - name: timestampItem
    label: Last Update Item
    type: TEXT
    context: item
    description: DateTime item holding the last successful update time. Shown as YYYY-MM-DD HH:mm.
    required: true
  - name: todayLabel
    label: Today Label
    type: TEXT
    description: Label on the left tile. Defaults to "Today" when empty.
    required: false
  - name: tomorrowLabel
    label: Tomorrow Label
    type: TEXT
    description: Label on the right tile. Defaults to "Tomorrow" when empty.
    required: false
  - name: blueLabel
    label: Blue Label
    type: TEXT
    description: Text shown on a tile when its state is BLUE. Defaults to "Blue" when empty.
    required: false
  - name: whiteLabel
    label: White Label
    type: TEXT
    description: Text shown on a tile when its state is WHITE. Defaults to "White" when empty.
    required: false
  - name: redLabel
    label: Red Label
    type: TEXT
    description: Text shown on a tile when its state is RED. Defaults to "Red" when empty.
    required: false
  - name: naLabel
    label: N/A Label
    type: TEXT
    description: Text shown on a tile when its state is anything else. Defaults to "N/A" when empty.
    required: false
component: div
config:
  style:
    display: flex
    flex-direction: column
    height: 120px
    margin: 10px 5px
    box-sizing: border-box
    padding: 8px
    position: relative
    overflow: hidden
    user-select: none
    font-size: 16px
    background: 'var(--f7-card-bg-color, #ffffff)'
    border-radius: var(--f7-card-border-radius, 8px)
    box-shadow: '0px 5px 10px #00000026'
slots:
  default:
  - component: oh-context
    config:
      variables:
        tempo:
          BLUE:
            bg: '#1976d2'
            fg: '#ffffff'
            name: Blue
            prop: blueLabel
            ring: 'none'
          WHITE:
            bg: '#f5f5f5'
            fg: '#1c1c1d'
            name: White
            prop: whiteLabel
            ring: 'inset 0 0 0 1px rgba(128,128,128,0.4)'
          RED:
            bg: '#d32f2f'
            fg: '#ffffff'
            name: Red
            prop: redLabel
            ring: 'none'
          NA:
            bg: '#5f6368'
            fg: '#ffffff'
            name: N/A
            prop: naLabel
            ring: 'none'
    slots:
      default:
      - component: div
        config:
          style:
            display: flex
            gap: 9px
            flex: 1 1 0
            min-height: 0
        slots:
          default:
          - component: div
            config:
              style:
                flex: 1 1 0
                min-width: 0
                box-sizing: border-box
                padding: 8px
                border-radius: 10px
                display: flex
                flex-direction: column
                justify-content: space-between
                line-height: 1.2
                background: '=(vars.tempo[items[props.todayItem] && items[props.todayItem].state] || vars.tempo.NA).bg'
                color: '=(vars.tempo[items[props.todayItem] && items[props.todayItem].state] || vars.tempo.NA).fg'
                box-shadow: '=(vars.tempo[items[props.todayItem] && items[props.todayItem].state] || vars.tempo.NA).ring'
            slots:
              default:
              - component: div
                config:
                  content: '=props.todayLabel || ''Today'''
                  style:
                    font-size: 11px
                    opacity: '0.8'
                    white-space: nowrap
                    overflow: hidden
                    text-overflow: ellipsis
              - component: div
                config:
                  content: '=props[(vars.tempo[items[props.todayItem] && items[props.todayItem].state] || vars.tempo.NA).prop] || (vars.tempo[items[props.todayItem] && items[props.todayItem].state] || vars.tempo.NA).name'
                  style:
                    font-size: 17px
                    font-weight: '600'
          - component: div
            config:
              style:
                flex: 1 1 0
                min-width: 0
                box-sizing: border-box
                padding: 8px
                border-radius: 10px
                display: flex
                flex-direction: column
                justify-content: space-between
                line-height: 1.2
                background: '=(vars.tempo[items[props.tomorrowItem] && items[props.tomorrowItem].state] || vars.tempo.NA).bg'
                color: '=(vars.tempo[items[props.tomorrowItem] && items[props.tomorrowItem].state] || vars.tempo.NA).fg'
                box-shadow: '=(vars.tempo[items[props.tomorrowItem] && items[props.tomorrowItem].state] || vars.tempo.NA).ring'
            slots:
              default:
              - component: div
                config:
                  content: '=props.tomorrowLabel || ''Tomorrow'''
                  style:
                    font-size: 11px
                    opacity: '0.8'
                    white-space: nowrap
                    overflow: hidden
                    text-overflow: ellipsis
              - component: div
                config:
                  content: '=props[(vars.tempo[items[props.tomorrowItem] && items[props.tomorrowItem].state] || vars.tempo.NA).prop] || (vars.tempo[items[props.tomorrowItem] && items[props.tomorrowItem].state] || vars.tempo.NA).name'
                  style:
                    font-size: 17px
                    font-weight: '600'
      - component: div
        config:
          content: '=(items[props.timestampItem] && items[props.timestampItem].state || '''').slice(10,11) === ''T'' ? items[props.timestampItem].state.slice(0,10) + '' '' + items[props.timestampItem].state.slice(11,16) : ''—'''
          style:
            height: 26px
            display: flex
            align-items: center
            justify-content: center
            font-size: 11px
            opacity: '0.55'
