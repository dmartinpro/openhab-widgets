uid: navimow_mower_compact
tags: []
props:
  parameters:
  - name: activityItem
    label: Activity Item
    type: TEXT
    context: item
    description: String item linked to the mower's activity channel. Value is one of idle/mowing/paused/docked/charging/returning/error/unknown.
    required: true
  - name: batteryItem
    label: Battery Item
    type: TEXT
    context: item
    description: 'Plain Number item (not Number:Dimensionless) linked to the mower''s battery-level channel. Integer 0-100.'
    required: true
  - name: modelItem
    label: Model Item
    type: TEXT
    context: item
    description: String item linked to the mower's model channel (e.g. X430). Selects the mower image by its first 2 characters.
    required: true
  - name: controlItem
    label: Control Item
    type: TEXT
    context: item
    description: String item linked to the mower's control channel. Not used by this card itself; passed on to the extended widget opened on click.
    required: true
  - name: modalWidget
    label: Extended Widget
    type: TEXT
    context: widget
    description: Widget opened in a popup when the card is clicked. It receives activityItem, controlItem, batteryItem and modelItem as props. Defaults to the main Navimow widget.
    required: false
    defaultValue: widget:navimow_mower_card
component: div
config:
  style:
    height: 120px
    margin: 10px 5px
    box-sizing: border-box
    position: relative
    overflow: hidden
    user-select: none
    font-size: 16px
    background: 'var(--f7-card-bg-color, #ffffff)'
    border-radius: var(--f7-card-border-radius, 8px)
    box-shadow: '0px 5px 10px #00000026'
slots:
  default:
  - component: oh-context
    config:
      variables:
        defaultImage: "data:image/png;base64,"
        modelImages:
          H2: "data:image/png;base64,"
          i1: "data:image/png;base64,"
          i2: "data:image/png;base64,"
          X3: "data:image/png;base64,"
          X4: "data:image/png;base64,"
        activityMeta:
          idle: {icon: 'f7:pause_circle', color: '#9e9e9e', label: Idle}
          mowing: {icon: 'f7:play_circle_fill', color: '#43a047', label: Mowing}
          paused: {icon: 'f7:pause_circle_fill', color: '#fb8c00', label: Paused}
          docked: {icon: 'f7:house_fill', color: '#1e88e5', label: Docked}
          charging: {icon: 'f7:bolt_fill', color: '#1e88e5', label: Charging}
          returning: {icon: 'f7:arrow_uturn_left', color: '#1e88e5', label: Returning}
          error: {icon: 'f7:exclamationmark_triangle_fill', color: '#e53935', label: Error}
          unknown: {icon: 'f7:question_circle_fill', color: '#9e9e9e', label: Unknown}
    slots:
      default:
      - component: oh-link
        config:
          style:
            display: flex
            align-items: center
            gap: 0.5rem
            width: 100%
            height: 100%
            box-sizing: border-box
            padding: 0.5rem
            opacity: '1'
            text-decoration: none
            color: inherit
          action: popup
          actionModal: '=props.modalWidget || ''widget:navimow_mower_card'''
          actionModalConfig:
            activityItem: '=props.activityItem'
            controlItem: '=props.controlItem'
            batteryItem: '=props.batteryItem'
            modelItem: '=props.modelItem'
        slots:
          default:
          - component: img
            config:
              src: '=vars.modelImages[(items[props.modelItem] && items[props.modelItem].state || '''').slice(0,2)] || vars.defaultImage'
              style:
                flex: 1 1 0
                min-width: 0
                max-width: 4.5rem
                height: auto
                object-fit: contain
                display: block
          - component: div
            config:
              style:
                flex: 1 1 0
                min-width: 0
                display: flex
                flex-direction: column
                justify-content: center
                gap: 0.5rem
            slots:
              default:
              - component: div
                config:
                  style:
                    display: flex
                    align-items: center
                    gap: 0.25rem
                slots:
                  default:
                  - component: oh-icon
                    config:
                      icon: '=(vars.activityMeta[items[props.activityItem] && items[props.activityItem].state] || vars.activityMeta.unknown).icon'
                      style:
                        flex: none
                        font-size: 1rem
                        color: '=(vars.activityMeta[items[props.activityItem] && items[props.activityItem].state] || vars.activityMeta.unknown).color'
                  - component: div
                    config:
                      content: '=(vars.activityMeta[items[props.activityItem] && items[props.activityItem].state] || vars.activityMeta.unknown).label'
                      style:
                        min-width: 0
                        overflow: hidden
                        text-overflow: ellipsis
                        white-space: nowrap
                        font-size: 0.8rem
                        font-weight: '600'
                        color: '=(vars.activityMeta[items[props.activityItem] && items[props.activityItem].state] || vars.activityMeta.unknown).color'
              - component: div
                config:
                  style:
                    display: flex
                    flex-direction: column
                    gap: 0.2rem
                slots:
                  default:
                  - component: div
                    config:
                      style:
                        height: 0.5rem
                        border-radius: 0.25rem
                        background: '#e0e0e0'
                        overflow: hidden
                    slots:
                      default:
                      - component: div
                        config:
                          style:
                            height: 100%
                            width: '=Math.max(0, Math.min(100, Number(items[props.batteryItem] ? items[props.batteryItem].state : 0))) + ''%'''
                            background: '=Number(items[props.batteryItem] ? items[props.batteryItem].state : 0) <= 20 ? ''#e53935'' : (Number(items[props.batteryItem] ? items[props.batteryItem].state : 0) <= 50 ? ''#fb8c00'' : ''#43a047'')'
                            transition: width 0.4s ease
                  - component: div
                    config:
                      content: '=(items[props.batteryItem] ? items[props.batteryItem].state : ''-'') + '' %'''
                      style:
                        font-size: 0.75rem
                        opacity: '0.7'
