uid: Label-Cell-Background
tags: []
props:
  parameters:
  - name: desc
    label: Label
    description: Title shown at the top-left of the tile
    type: TEXT
    required: false
  - name: imagepath
    label: Image path
    description: Background image
    type: TEXT
    required: false
  - name: targetItem
    label: Item
    description: Group opened in a popup on click
    type: TEXT
    context: item
    required: false
  - name: actionPage
    label: Page to open
    description: If set, a tap navigates to this page (e.g. page:my_page) instead of opening the group popup of targetItem.
    type: TEXT
    required: false
  - name: stateItem
    label: State Item
    description: Optional item whose state is shown as the big value line
    type: TEXT
    context: item
    required: false
  - name: imageFit
    label: Image fit
    description: cover (fills the tile, crops) or contain (whole image visible). Default cover.
    type: TEXT
    required: false
    options:
    - value: cover
      label: Cover
    - value: contain
      label: Contain
  - name: overlay
    label: Overlay darkness
    description: 0.01 to 1. Darkens the image so the white text stays readable. Default 0.45.
    type: DECIMAL
    required: false
component: oh-link
config:
  action: '=props.actionPage ? ''navigate'' : ''group'''
  actionPage: =props.actionPage
  actionGroupPopupItem: =props.targetItem
  style:
    display: flex
    flex-direction: column
    justify-content: space-between
    align-items: flex-start
    opacity: 1
    height: 120px
    margin: 10px 5px
    box-sizing: border-box
    padding: 0.75rem
    overflow: hidden
    min-width: 0
    user-select: none
    color: white
    background: '=''linear-gradient(rgba(0,0,0,'' + (props.overlay || 0.45) + ''), rgba(0,0,0,'' + (props.overlay || 0.45) + '')), url('' + props.imagepath + '') center / '' + (props.imageFit || ''cover'') + '' no-repeat'''
    background-color: 'var(--f7-card-bg-color, #ffffff)'
    border-radius: var(--f7-card-border-radius, 8px)
    box-shadow: '0px 5px 10px #00000026'
slots:
  default:
  - component: div
    config:
      content: =props.desc
      style:
        max-width: 100%
        overflow: hidden
        text-overflow: ellipsis
        white-space: nowrap
        font-size: 1.1rem
        font-weight: 600
        text-shadow: '0 1px 3px rgba(0,0,0,0.6)'
  - component: div
    config:
      content: '=props.stateItem ? (items[props.stateItem].displayState || items[props.stateItem].state) : '''''
      style:
        font-size: 1.6rem
        text-shadow: '0 1px 3px rgba(0,0,0,0.6)'
