uid: Label-Cell-Stream
tags: []
props:
  parameters:
  - name: desc
    label: Label
    description: Title shown at the top-left of the tile
    type: TEXT
    required: false
  - name: streamUrl
    label: Stream URL
    description: MJPEG or image URL used as live background, e.g. https://frigate.example/api/<camera>?fps=1&h=240
    type: TEXT
    required: true
  - name: actionPage
    label: Page to open
    description: Page opened on tap (e.g. page:my_page)
    type: TEXT
    required: false
  - name: overlay
    label: Overlay darkness
    description: 0.01 to 1. Darkens the image so the white text stays readable. Default 0.35.
    type: DECIMAL
    required: false
component: oh-link
config:
  action: navigate
  actionPage: =props.actionPage
  style:
    display: grid
    grid-template-columns: 100%
    grid-template-rows: 100%
    opacity: 1
    height: 120px
    margin: 10px 5px
    box-sizing: border-box
    overflow: hidden
    min-width: 0
    user-select: none
    color: white
    background-color: 'var(--f7-card-bg-color, #ffffff)'
    border-radius: var(--f7-card-border-radius, 8px)
    box-shadow: '0px 5px 10px #00000026'
slots:
  default:
  - component: img
    config:
      src: =props.streamUrl
      style:
        grid-area: 1 / 1
        display: block
        width: 100%
        height: 100%
        min-width: 0
        min-height: 0
        object-fit: cover
  - component: div
    config:
      style:
        grid-area: 1 / 1
        background: '=''rgba(0,0,0,'' + (props.overlay || 0.35) + '')'''
  - component: div
    config:
      content: =props.desc
      style:
        grid-area: 1 / 1
        align-self: start
        justify-self: start
        padding: 0.75rem
        max-width: 100%
        overflow: hidden
        text-overflow: ellipsis
        white-space: nowrap
        font-size: 1.1rem
        font-weight: 600
        text-shadow: '0 1px 3px rgba(0,0,0,0.6)'
