# Reverse proxy fragment for embedding Frigate's Live page in the
# video-control-center widget's oh-webframe, without its left sidebar.
#
# Usage: point page.yaml's `frigateUrl` at this proxy with ?embed=1
# appended, e.g.:
#   frigateUrl: "https://frigate.example.com/?embed=1"
#
# How it works: `map` looks up the `embed` query parameter on every
# request; when it's "1", $sidebar_hide_style holds a <style> tag that
# gets spliced into the HTML response just before </head> via
# sub_filter. Without ?embed=1 (normal browsing), $sidebar_hide_style
# is empty and sub_filter is a no-op — the existing `location /`
# behavior for regular access is unchanged.
#
# The injected style persists across Frigate's own client-side (SPA)
# navigation for the lifetime of that page load, since it's part of
# the DOM once injected — it does NOT persist across a hard page
# reload on a URL that lacks ?embed=1 (that's a fresh request with no
# query param, so nothing gets injected on that load).
#
# CAVEAT: the `nav` selector below is a starting guess, not confirmed
# against a live Frigate instance — inspect the actual sidebar element
# in the browser DevTools and adjust the selector if `nav` doesn't
# match (Frigate's Tailwind-generated class names can change between
# versions, so prefer a semantic tag or a stable id/data attribute if
# one exists over a utility class).

map $arg_embed $sidebar_hide_style {
    default "";
    "1"     "<style>nav{display:none!important;}</style>";
}

server {
    listen 443 ssl;
    server_name frigate.example.com;

    # ... SSL certificates ...

    location / {
        proxy_pass http://frigate-backend:5000;
        proxy_http_version 1.1;

        # Required for Frigate's live-update WebSocket connection
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # sub_filter can't rewrite compressed content, so disable gzip
        # on the upstream response for this proxied request
        proxy_set_header Accept-Encoding "";

        sub_filter '</head>' '${sidebar_hide_style}</head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }
}
