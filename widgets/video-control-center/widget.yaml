uid: video_control_center
tags: []
props:
  parameterGroups:
    - name: camera1
      label: Camera 1
    - name: camera2
      label: Camera 2
    - name: camera3
      label: Camera 3
  parameters:
    - name: camera1StreamUrl
      label: Stream URL
      type: TEXT
      description: Address of the live preview (MJPEG image, .m3u8 HLS playlist, or go2rtc WebRTC endpoint, matching Stream type below)
      required: true
      groupName: camera1
    - name: camera1StreamType
      label: Stream type
      type: TEXT
      description: Format served by Stream URL, determines how the preview is rendered
      required: true
      defaultValue: mjpeg
      limitToOptions: true
      options:
        - value: mjpeg
          label: MJPEG / still image
        - value: hls
          label: HLS / DASH (.m3u8)
        - value: webrtc
          label: WebRTC (go2rtc native)
      groupName: camera1
    - name: camera1RedirectUrl
      label: Click-through URL
      type: TEXT
      description: URL opened in an iframe popup when the tile is tapped (e.g. the Frigate live camera page)
      required: true
      groupName: camera1
    - name: camera2StreamUrl
      label: Stream URL
      type: TEXT
      description: Address of the live preview (MJPEG image, .m3u8 HLS playlist, or go2rtc WebRTC endpoint, matching Stream type below)
      required: true
      groupName: camera2
    - name: camera2StreamType
      label: Stream type
      type: TEXT
      description: Format served by Stream URL, determines how the preview is rendered
      required: true
      defaultValue: mjpeg
      limitToOptions: true
      options:
        - value: mjpeg
          label: MJPEG / still image
        - value: hls
          label: HLS / DASH (.m3u8)
        - value: webrtc
          label: WebRTC (go2rtc native)
      groupName: camera2
    - name: camera2RedirectUrl
      label: Click-through URL
      type: TEXT
      description: URL opened in an iframe popup when the tile is tapped (e.g. the Frigate live camera page)
      required: true
      groupName: camera2
    - name: camera3StreamUrl
      label: Stream URL
      type: TEXT
      description: Address of the live preview (MJPEG image, .m3u8 HLS playlist, or go2rtc WebRTC endpoint, matching Stream type below)
      required: true
      groupName: camera3
    - name: camera3StreamType
      label: Stream type
      type: TEXT
      description: Format served by Stream URL, determines how the preview is rendered
      required: true
      defaultValue: mjpeg
      limitToOptions: true
      options:
        - value: mjpeg
          label: MJPEG / still image
        - value: hls
          label: HLS / DASH (.m3u8)
        - value: webrtc
          label: WebRTC (go2rtc native)
      groupName: camera3
    - name: camera3RedirectUrl
      label: Click-through URL
      type: TEXT
      description: URL opened in an iframe popup when the tile is tapped (e.g. the Frigate live camera page)
      required: true
      groupName: camera3
component: div
config:
  style:
    display: flex
    flex-direction: column
    gap: 1rem
    width: 100%
    max-width: 100%
    flex: 1 1 100%
    grid-column: 1 / -1
    box-sizing: border-box
slots:
  default:
    - component: div
      config:
        style:
          display: flex
          flex-wrap: wrap
          gap: 1rem
          width: 100%
      slots:
        default:
          - component: f7-link
            config:
              popupOpen: ".video-control-center-camera1-popup"
              style:
                display: block
                flex: "1 1 260px"
                min-width: "200px"
                text-decoration: none
            slots:
              default:
                - component: div
                  config:
                    style:
                      width: 100%
                      aspect-ratio: "16/9"
                      background: "#000"
                      border-radius: "8px"
                      overflow: hidden
                      display: flex
                      align-items: center
                      justify-content: center
                  slots:
                    default:
                      - component: img
                        config:
                          src: =props.camera1StreamUrl
                          visible: "=!props.camera1StreamType || props.camera1StreamType == 'mjpeg'"
                          style:
                            width: 100%
                            height: 100%
                            object-fit: cover
                      - component: oh-video
                        config:
                          url: =props.camera1StreamUrl
                          playerType: videojs
                          hideControls: true
                          startMuted: true
                          visible: "=props.camera1StreamType == 'hls'"
                          style:
                            width: 100%
                            height: 100%
                      - component: oh-video
                        config:
                          url: =props.camera1StreamUrl
                          playerType: webrtc
                          hideControls: true
                          startMuted: true
                          visible: "=props.camera1StreamType == 'webrtc'"
                          style:
                            width: 100%
                            height: 100%
          - component: f7-link
            config:
              popupOpen: ".video-control-center-camera2-popup"
              style:
                display: block
                flex: "1 1 260px"
                min-width: "200px"
                text-decoration: none
            slots:
              default:
