    - component: f7-popup
      config:
        class:
          - video-control-center-camera1-popup
        style:
          display: flex
          flex-direction: column
      slots:
        default:
          - component: div
            config:
              style:
                display: flex
                justify-content: flex-end
                padding: "0.5rem"
            slots:
              default:
                - component: oh-link
                  config:
                    text: Fermer
                    iconF7: xmark_circle_fill
                    popupClose: ".video-control-center-camera1-popup"
          - component: oh-webframe
            config:
              src: =props.camera1RedirectUrl
              height: 600
              style:
                width: 100%
