                          url: =props.camera2StreamUrl
                          playerType: webrtc
                          hideControls: true
                          startMuted: true
                          visible: "=props.camera2StreamType == 'webrtc'"
                          style:
                            width: 100%
                            height: 100%
          - component: f7-link
